<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伴走者一覧 - りりーふプロジェクト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#32adc6">
    <link rel="icon" type="image/png" href="./img/favicon.png">
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="bg-white text-slate-700">
    <!-- ナビゲーションバー -->
    <div id="nav"></div>

    <!-- メインコンテンツ -->
    <main class="max-w-6xl mx-auto p-4 py-12">
        <h1 class="text-4xl font-bold text-slate-800 mb-4">伴走者一覧</h1>
        <p class="text-lg text-slate-600 mb-12">
            りりーふプロジェクトの伴走者をご紹介します。各専門家が子どもたちの成長をサポートします。
        </p>

        <!-- 伴走者一覧 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="mentors-grid">
            <!-- 伴走者カードはJavaScriptで動的に生成されます -->
        </div>

        <!-- 伴走者になる -->
        <div class="mt-12 bg-blue-50 border border-blue-200 rounded-lg p-8 text-center">
            <h3 class="text-2xl font-bold text-slate-800 mb-4">伴走者として参加しませんか？</h3>
            <p class="text-slate-600 mb-6">
                あなたの専門知識と経験で、子どもたちの未来を支えませんか？
            </p>
            <a href="mentor-register.html" class="bg-blue-600 text-white px-8 py-4 rounded-lg hover:bg-blue-700 transition text-lg font-semibold">
                伴走者登録
            </a>
        </div>
    </main>

    <div id="footer"></div>
    <script src="assets/script.js" defer></script>
    <script>
        let allMentors = [];

        // 伴走者カードを生成する関数
        function createMentorCard(mentor) {
            const avatar = mentor.image
                ? `<img src="${mentor.image}" alt="${mentor.name}の写真" class="w-20 h-20 rounded-full mx-auto mb-4 object-cover border border-slate-200" loading="lazy">`
                : `<div class="w-20 h-20 bg-slate-300 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl font-bold text-slate-600">${mentor.initial}</div>`;

            return `
                <div class="mentor-card bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm hover:shadow-md transition">
                    <div class="p-6">
                        ${avatar}
                        <h3 class="text-xl font-bold text-slate-800 text-center mb-2">${mentor.name}</h3>
                        <p class="text-slate-600 text-center mb-4">${mentor.title}</p>
                        <div class="space-y-2 text-sm text-slate-600">
                            <p><strong>経験年数:</strong> ${mentor.experience}</p>
                            <p><strong>資格:</strong> ${mentor.qualifications}</p>
                        </div>
                        <div class="mt-4">
                            <a href="mentor-detail.html?id=${mentor.id}" class="block text-center bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                                詳細を見る
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        // 伴走者を表示する関数
        function displayMentors(mentors) {
            const grid = document.getElementById('mentors-grid');
            grid.innerHTML = mentors.map(createMentorCard).join('');
        }

        // JSONデータを読み込む関数
        async function loadMentors() {
            try {
                const response = await fetch('data/mentors.json');
                const mentors = await response.json();

                if (!Array.isArray(mentors)) {
                    throw new Error('Invalid mentors data format');
                }

                allMentors = mentors;
                displayMentors(allMentors);
            } catch (error) {
                console.error('伴走者データの読み込みに失敗しました:', error);
                document.getElementById('mentors-grid').innerHTML = '<p class="text-center text-slate-600 md:col-span-2 lg:col-span-3">データの読み込みに失敗しました。</p>';
            }
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            loadMentors();
        });
    </script>
</body>
</html>
