<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伴走者登録 - りりーふプロジェクト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#32adc6">
    <link rel="icon" type="image/png" href="./img/favicon.png">
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="bg-white text-slate-700">
    <!-- ナビゲーションバー -->
    <div id="nav"></div>

    <!-- メインコンテンツ -->
    <main class="max-w-3xl mx-auto p-4 py-12">
        <h1 class="text-4xl font-bold text-slate-800 mb-4">伴走者登録</h1>
        <p class="text-lg text-slate-600 mb-8">
            りりーふプロジェクトの伴走者として活動をご希望の方は、以下のフォームからお申し込みください。
            審査後、登録の可否についてご連絡いたします。
        </p>
        <div class="mb-8 bg-blue-50 border border-blue-200 rounded-lg p-6">
            <h2 class="text-xl font-bold text-slate-800 mb-2">応募前に活動開始までの流れをご確認ください</h2>
            <p class="text-slate-600 mb-4">必要書類、審査、初回面談、オリエンテーション、予約導線の設定についてご案内しています。</p>
            <a href="./mentor-guide.html" class="inline-flex items-center justify-center bg-blue-600 text-white px-5 py-3 rounded-lg hover:bg-blue-700 transition font-semibold">伴走者の登録・活動開始ガイドを見る</a>
        </div>

        <!-- 登録フォーム（MS Forms 埋め込み） -->
        <div class="w-full">
            <iframe src="https://forms.cloud.microsoft/r/RgKEarh0ax"
                    width="100%" height="1200px"
                    frameborder="0"
                    marginwidth="0" marginheight="0"
                    style="border: none; max-width: 100%;"
                    allowfullscreen
                    title="伴走者登録フォーム">
            </iframe>
        </div>
    </main>

    <div id="footer"></div>
    <script src="assets/script.js" defer></script>
</body>
</html>
