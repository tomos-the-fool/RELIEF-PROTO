<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伴走者詳細 - りりーふプロジェクト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#32adc6">
    <link rel="icon" type="image/png" href="./img/favicon.png">
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="bg-white text-slate-700">
    <!-- ナビゲーションバー -->
    <div id="nav"></div>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto p-4 py-12">
        <!-- 伴走者プロフィール -->
        <div class="mb-12 flex flex-col sm:flex-row gap-8">
            <div class="flex-shrink-0">
                <div class="w-40 h-40 rounded-lg overflow-hidden border border-slate-200">
                    <img id="mentor-image" src="" alt="伴走者の写真" class="w-full h-full object-cover hidden">
                    <div id="mentor-initial-avatar" class="w-full h-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center">
                        <div id="mentor-initial-text" class="text-5xl font-bold text-white">YS</div>
                    </div>
                </div>
            </div>
            <div class="flex-1">
                <h1 id="mentor-name" class="text-3xl font-bold text-slate-800 mb-2">山田 太郎</h1>
                <p id="mentor-title" class="text-lg text-slate-600 mb-4">臨床心理士・キャリアカウンセラー</p>
                <div id="mentor-badges" class="flex flex-wrap gap-2 mb-4">
                    <span class="px-3 py-1 bg-blue-100 text-blue-800 text-sm font-medium rounded-full">伴走者</span>
                    <span class="px-3 py-1 bg-green-100 text-green-800 text-sm font-medium rounded-full">相談受付中</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="text-center">
                        <div id="mentor-support-count" class="text-2xl font-bold text-slate-800">50</div>
                        <div class="text-sm text-slate-600">支援実績</div>
                    </div>
                    <div class="text-center">
                        <div id="mentor-rating" class="text-2xl font-bold text-slate-800">4.8</div>
                        <div class="text-sm text-slate-600">評価平均</div>
                    </div>
                    <div class="text-center">
                        <div id="mentor-experience" class="text-2xl font-bold text-slate-800">3年</div>
                        <div class="text-sm text-slate-600">経験年数</div>
                    </div>
                </div>
                <div class="flex gap-4">
                    <button class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
                        相談を申し込む
                    </button>
                    <button class="px-6 py-3 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition-colors font-medium">
                        お気に入りに追加
                    </button>
                </div>
            </div>
        </div>

        <!-- タブナビゲーション -->
        <div class="border-b border-slate-200 mb-8">
            <nav class="flex space-x-8">
                <button class="tab-button active py-4 px-1 border-b-2 border-blue-600 text-blue-600 font-medium" data-tab="profile">
                    プロフィール
                </button>
                <button class="tab-button py-4 px-1 border-b-2 border-transparent text-slate-600 hover:text-slate-800 font-medium" data-tab="experience">
                    経歴・資格
                </button>
                <button class="tab-button py-4 px-1 border-b-2 border-transparent text-slate-600 hover:text-slate-800 font-medium" data-tab="reviews">
                    評価・口コミ
                </button>
                <button class="tab-button py-4 px-1 border-b-2 border-transparent text-slate-600 hover:text-slate-800 font-medium" data-tab="availability">
                    予約可能時間
                </button>
            </nav>
        </div>

        <!-- タブコンテンツ -->
        <div class="tab-content" id="profile">
            <div class="space-y-6">
                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">自己紹介</h2>
                    <div id="mentor-introduction" class="space-y-4 text-slate-600 leading-relaxed">
                        <p>伴走者の自己紹介を読み込み中です。</p>
                    </div>
                </section>

                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">対応内容</h2>
                    <div id="mentor-support-areas" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-4 rounded-lg">
                            <h3 class="font-semibold text-slate-800 mb-2">読み込み中</h3>
                            <p class="text-sm text-slate-600">対応内容を取得しています。</p>
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">支援スタイル</h2>
                    <div id="mentor-support-style" class="bg-blue-50 p-6 rounded-lg space-y-4">
                        <p class="text-slate-700 leading-relaxed">支援スタイルを読み込み中です。</p>
                    </div>
                </section>
            </div>
        </div>

        <div class="tab-content hidden" id="experience">
            <div class="space-y-6">
                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">経歴</h2>
                    <div id="mentor-career" class="space-y-4">
                        <div class="border-l-4 border-blue-600 pl-4">
                            <div class="flex items-center justify-between mb-2">
                                <h3 class="font-semibold text-slate-800">読み込み中</h3>
                                <span class="text-sm text-slate-600">-</span>
                            </div>
                            <p class="text-slate-600 text-sm">経歴情報を取得しています。</p>
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">資格・研修</h2>
                    <p id="mentor-qualifications" class="text-slate-700"></p>
                </section>
            </div>
        </div>

        <div class="tab-content hidden" id="reviews">
            <div class="space-y-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 id="mentor-reviews-heading" class="text-xl font-bold text-slate-800">評価・口コミ (0件)</h2>
                    <div class="flex items-center space-x-2">
                        <div id="mentor-reviews-stars" class="flex items-center">
                            <span class="text-yellow-400">★★★★★</span>
                        </div>
                        <span id="mentor-reviews-rating" class="text-slate-600 font-medium">4.8</span>
                    </div>
                </div>

                <div id="mentor-reviews-list" class="space-y-4">
                    <div class="border border-slate-200 rounded-lg p-4">
                        <p class="text-slate-700">口コミを読み込み中です。</p>
                    </div>
                </div>

                <div class="text-center mt-8">
                    <button class="px-6 py-3 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition-colors font-medium">
                        もっと口コミを見る
                    </button>
                </div>
            </div>
        </div>

        <div class="tab-content hidden" id="availability">
            <div class="space-y-6">
                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">予約可能時間</h2>
                    <div class="bg-blue-50 p-4 rounded-lg mb-6">
                        <p id="mentor-consultation" class="text-slate-700"></p>
                    </div>
                </section>

                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">今週の予約可能枠</h2>
                    <div id="mentor-availability-slots" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="border border-slate-200 rounded-lg p-4">
                            <h3 class="font-semibold text-slate-800 mb-3">読み込み中</h3>
                            <div class="space-y-2">
                                <button class="w-full text-left px-3 py-2 bg-green-100 text-green-800 rounded text-sm">予約枠を取得しています</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">予約方法</h2>
                    <div class="bg-slate-50 p-4 rounded-lg">
                        <ol id="mentor-booking-steps" class="list-decimal list-inside space-y-2 text-slate-700">
                            <li>予約方法を読み込み中です。</li>
                        </ol>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div id="footer"></div>
    <script src="assets/script.js" defer></script>
    <script>
        function renderStars(rating) {
            const fullStars = Math.round(Number(rating) || 0);
            return '★★★★★'.slice(0, fullStars).padEnd(5, '☆');
        }

        function renderParagraphs(items, emptyText) {
            if (!Array.isArray(items) || items.length === 0) {
                return `<p>${emptyText}</p>`;
            }

            return items.map(item => `<p>${item}</p>`).join('');
        }

        function renderSupportAreas(items) {
            if (!Array.isArray(items) || items.length === 0) {
                return `
                    <div class="bg-slate-50 p-4 rounded-lg">
                        <h3 class="font-semibold text-slate-800 mb-2">掲載準備中</h3>
                        <p class="text-sm text-slate-600">対応内容は準備中です。</p>
                    </div>
                `;
            }

            return items.map(item => `
                <div class="bg-slate-50 p-4 rounded-lg">
                    <h3 class="font-semibold text-slate-800 mb-2">${item.title}</h3>
                    <p class="text-sm text-slate-600">${item.description}</p>
                </div>
            `).join('');
        }

        function renderCareer(items) {
            if (!Array.isArray(items) || items.length === 0) {
                return `
                    <div class="border-l-4 border-slate-300 pl-4">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-semibold text-slate-800">掲載準備中</h3>
                            <span class="text-sm text-slate-600">-</span>
                        </div>
                        <p class="text-slate-600 text-sm">経歴情報は準備中です。</p>
                    </div>
                `;
            }

            return items.map(item => `
                <div class="${item.primary ? 'border-blue-600' : 'border-slate-300'} border-l-4 pl-4">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="font-semibold text-slate-800">${item.title}</h3>
                        <span class="text-sm text-slate-600">${item.period}</span>
                    </div>
                    <p class="text-slate-600 text-sm">${item.description}</p>
                </div>
            `).join('');
        }

        function renderReviews(items) {
            if (!Array.isArray(items) || items.length === 0) {
                return `
                    <div class="border border-slate-200 rounded-lg p-4">
                        <p class="text-slate-700">口コミはまだありません。</p>
                    </div>
                `;
            }

            return items.map(item => `
                <div class="border border-slate-200 rounded-lg p-4">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center space-x-2">
                            <span class="text-yellow-400">${renderStars(item.rating)}</span>
                            <span class="text-sm text-slate-600">${item.date}</span>
                        </div>
                    </div>
                    <p class="text-slate-700 mb-2">${item.comment}</p>
                    <p class="text-sm text-slate-600">${item.author}</p>
                </div>
            `).join('');
        }

        function renderAvailability(items) {
            if (!Array.isArray(items) || items.length === 0) {
                return `
                    <div class="border border-slate-200 rounded-lg p-4">
                        <h3 class="font-semibold text-slate-800 mb-3">掲載準備中</h3>
                        <p class="text-sm text-slate-600">予約可能枠は準備中です。</p>
                    </div>
                `;
            }

            return items.map(day => `
                <div class="border border-slate-200 rounded-lg p-4">
                    <h3 class="font-semibold text-slate-800 mb-3">${day.day}</h3>
                    <div class="space-y-2">
                        ${(day.slots || []).map(slot => `
                            <button class="w-full text-left px-3 py-2 ${slot.reserved ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : 'bg-green-100 text-green-800 hover:bg-green-200'} rounded text-sm transition-colors" ${slot.reserved ? 'disabled' : ''}>
                                ${slot.label} (${slot.reserved ? '予約済み' : slot.mode})
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderBookingSteps(items) {
            if (!Array.isArray(items) || items.length === 0) {
                return '<li>予約方法は準備中です。</li>';
            }

            return items.map(item => `<li>${item}</li>`).join('');
        }

        async function loadMentorDetail() {
            try {
                const params = new URLSearchParams(window.location.search);
                const mentorId = params.get('id');

                if (!mentorId) {
                    return;
                }

                const response = await fetch('data/mentors.json');
                const mentors = await response.json();

                if (!Array.isArray(mentors)) {
                    throw new Error('Invalid mentors data format');
                }

                const mentor = mentors.find(item => String(item.id) === mentorId);

                if (!mentor) {
                    return;
                }

                const mentorName = document.getElementById('mentor-name');
                const mentorTitle = document.getElementById('mentor-title');
                const mentorExperience = document.getElementById('mentor-experience');
                const mentorSupportCount = document.getElementById('mentor-support-count');
                const mentorRating = document.getElementById('mentor-rating');
                const mentorBadges = document.getElementById('mentor-badges');
                const mentorImage = document.getElementById('mentor-image');
                const mentorInitialAvatar = document.getElementById('mentor-initial-avatar');
                const mentorInitialText = document.getElementById('mentor-initial-text');

                const mentorQualifications = document.getElementById('mentor-qualifications');
                const mentorIntroduction = document.getElementById('mentor-introduction');
                const mentorSupportAreas = document.getElementById('mentor-support-areas');
                const mentorSupportStyle = document.getElementById('mentor-support-style');
                const mentorCareer = document.getElementById('mentor-career');
                const mentorReviewsHeading = document.getElementById('mentor-reviews-heading');
                const mentorReviewsStars = document.getElementById('mentor-reviews-stars');
                const mentorReviewsRating = document.getElementById('mentor-reviews-rating');
                const mentorReviewsList = document.getElementById('mentor-reviews-list');
                const mentorConsultation = document.getElementById('mentor-consultation');
                const mentorAvailabilitySlots = document.getElementById('mentor-availability-slots');
                const mentorBookingSteps = document.getElementById('mentor-booking-steps');

                mentorName.textContent = mentor.name || mentorName.textContent;
                mentorTitle.textContent = mentor.title || mentorTitle.textContent;
                mentorExperience.textContent = mentor.experience || mentorExperience.textContent;
                mentorSupportCount.textContent = mentor.support_count || mentorSupportCount.textContent;
                mentorRating.textContent = mentor.rating || mentorRating.textContent;
                mentorQualifications.textContent = mentor.qualifications ?? '';
                mentorBadges.innerHTML = `
                    <span class="px-3 py-1 bg-blue-100 text-blue-800 text-sm font-medium rounded-full">${mentor.title || '伴走者'}</span>
                    <span class="px-3 py-1 bg-green-100 text-green-800 text-sm font-medium rounded-full">${mentor.status || '相談受付中'}</span>
                `;
                mentorIntroduction.innerHTML = renderParagraphs(mentor.introduction, '自己紹介は準備中です。');
                mentorSupportAreas.innerHTML = renderSupportAreas(mentor.support_areas);
                mentorSupportStyle.innerHTML = renderParagraphs(mentor.support_style, '支援スタイルは準備中です。');
                mentorCareer.innerHTML = renderCareer(mentor.career);
                mentorReviewsHeading.textContent = `評価・口コミ (${Array.isArray(mentor.reviews) ? mentor.reviews.length : 0}件)`;
                mentorReviewsStars.innerHTML = `<span class="text-yellow-400">${renderStars(mentor.rating)}</span>`;
                mentorReviewsRating.textContent = mentor.rating || '-';
                mentorReviewsList.innerHTML = renderReviews(mentor.reviews);
                mentorConsultation.innerHTML = `<strong>${mentor.consultation?.first?.split(':')[0] || '初回相談'}:</strong> ${mentor.consultation?.first?.split(':').slice(1).join(':').trim() || ''}<br><strong>${mentor.consultation?.regular?.split(':')[0] || '通常相談'}:</strong> ${mentor.consultation?.regular?.split(':').slice(1).join(':').trim() || ''}`;
                mentorAvailabilitySlots.innerHTML = renderAvailability(mentor.availability_slots);
                mentorBookingSteps.innerHTML = renderBookingSteps(mentor.booking_steps);
                document.title = `${mentor.name} - 伴走者詳細 - りりーふプロジェクト`;

                mentorInitialText.textContent = mentor.initial || (mentor.name ? mentor.name.slice(0, 2) : '伴走');

                if (mentor.image) {
                    mentorImage.src = mentor.image;
                    mentorImage.alt = `${mentor.name}の写真`;
                    mentorImage.classList.remove('hidden');
                    mentorInitialAvatar.classList.add('hidden');

                    mentorImage.onerror = function() {
                        mentorImage.classList.add('hidden');
                        mentorInitialAvatar.classList.remove('hidden');
                    };
                }
            } catch (error) {
                console.error('伴走者詳細データの読み込みに失敗しました:', error);
            }
        }

        // タブ切り替え機能
        document.addEventListener('DOMContentLoaded', function() {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');

            loadMentorDetail();

            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const tabId = this.getAttribute('data-tab');

                    // ボタンのアクティブ状態を更新
                    tabButtons.forEach(btn => {
                        btn.classList.remove('active', 'border-blue-600', 'text-blue-600');
                        btn.classList.add('border-transparent', 'text-slate-600');
                    });
                    this.classList.add('active', 'border-blue-600', 'text-blue-600');
                    this.classList.remove('border-transparent', 'text-slate-600');

                    // コンテンツの表示/非表示
                    tabContents.forEach(content => {
                        if (content.id === tabId) {
                            content.classList.remove('hidden');
                        } else {
                            content.classList.add('hidden');
                        }
                    });
                });
            });
        });
    </script>
</body>
</html>
